function genStyle(k){
  const s=STY[k],keepClips=P.clips;P=fresh();P.clips=keepClips;P.bpm=s.bpm;P.swing=s.sw;P.key=s.key;P.scale=s.sc;P.kit=s.kit;
  P.tracks=[mkTrack('drums','Batería','drums'),mkTrack('bass',INST[s.ins[0]][0],'inst',s.ins[0]),mkTrack('chords',INST[s.ins[1]][0],'inst',s.ins[1]),mkTrack('lead',INST[s.ins[2]][0],'inst',s.ins[2])];
  const bt=P.tracks[1];bt.vol=.85;P.tracks[2].vol=.6;P.tracks[3].vol=.5;P.tracks[3].rev=.3;P.tracks[3].dly=.2;P.tracks[2].rev=.2;
  const build=(p,parts)=>{p.bars=4;
    if(parts.dr)LANES.forEach(([l])=>{const spec=s.dr[l]||[],a=Array(64).fill(0);for(let b=0;b<4;b++){const st=Array.isArray(spec[0])?spec[b%spec.length]:spec;st.forEach(x=>a[b*16+x]=1)}p.d[l]=a});

const idbO=()=>new Promise((ok,no)=>{const r=indexedDB.open('mthi-beats',1);r.onupgradeneeded=()=>r.result.createObjectStore('a');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});

async function aGet(id){try{const d=await idbO();return await new Promise(ok=>{const r=d.transaction('a').objectStore('a').get(id);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})}catch(e){return null}}

let mr=null,chunks=[],stream=null;

async function recStart(){

  mr.start();const base0=t0+4*bd;const m=P.song.length>1||P.pats.slice(1).some(p=>Object.keys(p.n).length)?'song':'pat';

function dVoz(){
  const M=$('#main'),c=h('div','card');c.innerHTML='<h3>Grabar tu voz</h3><div class="hint">Toca ● arriba: suenan 4 clicks y empiezas a cantar o rapear encima del beat. Para detener, toca ■. Usa audífonos para que el micrófono no capte el beat.</div>';

function wav(buf){const n=buf.length,d=new DataView(new ArrayBuffer(44+n*4)),w=(o,s)=>{for(let i=0;i<s.length;i++)d.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');d.setUint32(4,36+n*4,true);w(8,'WAVEfmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,2,true);d.setUint32(24,buf.sampleRate,true);d.setUint32(28,buf.sampleRate*4,true);d.setUint16(32,4,true);d.setUint16(34,16,true);w(36,'data');d.setUint32(40,n*4,true);const L=buf.getChannelData(0),R=buf.numberOfChannels>1?buf.getChannelData(1):L;let pk=0;for(let i=0;i<n;i++)pk=Math.max(pk,Math.abs(L[i]),Math.abs(R[i]));const k=pk>.01?.95/pk:1;let o=44;for(let i=0;i<n;i++){for(const x of [L[i],R[i]]){const s=Math.max(-1,Math.min(1,x*k));d.setInt16(o,s<0?s*32768:s*32767,true);o+=2}}return new Blob([d],{type:'audio/wav'})}

function dExp(){const M=$('#main'),c=h('div','card');c.innerHTML='<h3>Exportar tu música</h3><div class="hint">Crea un archivo de audio WAV con calidad de estudio, con tus voces incluidas y sin marca de agua.</div>';
  const mk=(txt,m,cls)=>{const b=h('button','act'+(cls?' '+cls:''),txt);b.onclick=()=>exp(m);c.appendChild(b)};mk('⬇️ Canción completa','song');mk('⬇️ Solo el patrón '+'ABCDEFGH'[S.pat],'pat','sec');const st=h('div','hint');st.id='est';c.appendChild(st);M.appendChild(c)}
